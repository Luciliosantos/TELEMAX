{% extends "base.html" %}
{% block title %}Recuperar senha{% endblock %}
{% block robots %}noindex,nofollow{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1>Recuperar senha</h1>
  <form method="post" class="form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>E-mail cadastrado <input type="email" name="email" required></label>
    <button class="btn btn-neon btn-block" type="submit">Enviar instruções</button>
  </form>
  <p class="auth-links"><a href="/entrar">Voltar ao login</a></p>
</div>
{% endblock %}
